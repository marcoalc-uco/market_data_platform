repos:
  # --- ISORT (backend Python: src + tests) ---
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (sort imports)
        language_version: python3.14
        args: ["--profile=black"]
        files: ^market_data_backend_platform/(src|tests)/
        stages: [pre-commit]

  # --- BLACK (backend Python: src + tests) ---
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3.14
        files: ^market_data_backend_platform/(src|tests)/
        stages: [pre-commit]

  # --- PYLINT (backend Python only) ---
  - repo: local
    hooks:
      - id: pylint
        name: pylint (local)
        entry: pylint
        language: python
        types: [python]
        files: ^market_data_backend_platform/src/
        args:
          - "--rcfile=market_data_backend_platform/.pylintrc"
          - "--disable=import-error"
        additional_dependencies:
          - pylint==4.0.3
          - pydantic==2.12.4
          - pydantic-settings==2.12.0
          - typing_extensions==4.15.0
        stages: [pre-commit]

  # --- MYPY (backend Python only) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^market_data_backend_platform/src/
        exclude: ^(market_data_backend_platform/tests/|market_data_backend_platform/alembic/)
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-requests
          - sqlalchemy
        args: ["--config-file=market_data_backend_platform/pyproject.toml"]
        stages: [pre-commit]

  # --- PRE-COMMIT HOOKS (monorepo-wide) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # --- PYTEST (backend only, pre-push) ---
  # Unit tests only via the backend .venv (fast, no Docker needed).
  # Integration tests run exclusively in CI/CD (GitHub Actions)
  # where Docker services are available in a controlled environment.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests (backend .venv)
        entry: bash -c "cd market_data_backend_platform && .venv/Scripts/python.exe -m pytest tests/unit/ -q"
        language: system
        types: [python]
        files: ^market_data_backend_platform/
        stages: [pre-push]
        pass_filenames: false

  # --- ESLINT (frontend JS only, pre-commit) ---
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c "if [ -f market_data_frontend_platform/package.json ]; then cd market_data_frontend_platform && npm run lint; fi"
        language: system
        files: ^market_data_frontend_platform/src/
        types_or: [javascript, jsx]
        stages: [pre-commit]
        pass_filenames: false

  # --- PRETTIER (frontend JS only, pre-commit) ---
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (frontend)
        entry: bash -c "if [ -f market_data_frontend_platform/package.json ]; then cd market_data_frontend_platform && npm run format; fi"
        language: system
        files: ^market_data_frontend_platform/src/
        stages: [pre-commit]
        pass_filenames: false

  # --- VITEST (frontend only, pre-push) ---
  - repo: local
    hooks:
      - id: vitest-full
        name: Vitest full suite (frontend)
        entry: bash -c "if [ -f market_data_frontend_platform/package.json ]; then cd market_data_frontend_platform && npm test; fi"
        language: system
        files: ^market_data_frontend_platform/
        stages: [pre-push]
        pass_filenames: false
