# CI — Frontend (Market Data Frontend Platform)
# Runs on changes to market_data_frontend_platform/ only.

name: CI Frontend

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "market_data_frontend_platform/**"
  pull_request:
    branches:
      - main
    paths:
      - "market_data_frontend_platform/**"

defaults:
  run:
    working-directory: market_data_frontend_platform

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code Quality (ESLint + Prettier)
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: market_data_frontend_platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Job 2: Tests + Build
  # ---------------------------------------------------------------------------
  tests:
    name: Tests & Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: market_data_frontend_platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build
